name: Run Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests (all modules)
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Gradle attempt ${attempt}/3"
            if ./gradlew testDebugUnitTest --stacktrace --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle failed; retrying after ${attempt}0s..."
              sleep "$((attempt * 10))"
            fi
          done
          exit 1

